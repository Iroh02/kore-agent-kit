<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent Console</title>
<style>
  :root{
    --bg:#0e1117; --panel:#161b24; --line:#262d3a; --ink:#e6e9ef;
    --muted:#8b94a7; --accent:#5b8cff; --ok:#3ecf8e; --warn:#f0b429;
  }
  *{box-sizing:border-box}
  body{margin:0;font:14px/1.55 ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
       background:var(--bg);color:var(--ink);height:100vh;display:flex;flex-direction:column}
  header{display:flex;align-items:center;gap:12px;padding:12px 18px;border-bottom:1px solid var(--line);flex-wrap:wrap}
  header h1{font-size:15px;margin:0;font-weight:600;letter-spacing:.2px}
  .pill{font-size:11px;padding:3px 9px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
  .pill.live{color:var(--ok);border-color:#1f5c43}
  .pill.mock{color:var(--warn);border-color:#5c4a1f}
  header .spacer{flex:1}
  button{font:inherit;background:var(--panel);color:var(--ink);border:1px solid var(--line);
         border-radius:8px;padding:7px 13px;cursor:pointer}
  button:hover{border-color:var(--accent)}
  button:disabled{opacity:.5;cursor:default}
  main{flex:1;display:grid;grid-template-columns:1fr 380px;min-height:0}
  #chat{overflow-y:auto;padding:22px;display:flex;flex-direction:column;gap:16px}
  .msg{max-width:760px;white-space:pre-wrap;word-wrap:break-word}
  .msg .who{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:5px}
  .msg.user .bubble{background:#1c2433;border:1px solid var(--line);padding:11px 14px;border-radius:10px}
  .msg.bot .bubble{background:transparent;padding:0}
  .srcs{margin-top:9px;display:flex;gap:6px;flex-wrap:wrap}
  .srcs span{font-size:11px;color:var(--muted);border:1px solid var(--line);padding:2px 8px;border-radius:6px}
  aside{border-left:1px solid var(--line);background:var(--panel);overflow-y:auto;padding:16px}
  aside h2{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0 0 12px}
  .step{border:1px solid var(--line);border-radius:9px;padding:10px;margin-bottom:10px;background:#11161f}
  .step .name{font-weight:600;color:var(--accent);font-size:13px}
  .step pre{margin:6px 0 0;font-size:11.5px;color:var(--muted);white-space:pre-wrap;word-break:break-word;max-height:170px;overflow:auto}
  form{display:flex;gap:10px;padding:14px 18px;border-top:1px solid var(--line)}
  input{flex:1;background:var(--panel);border:1px solid var(--line);border-radius:9px;
        padding:11px 14px;color:var(--ink);font:inherit}
  input:focus{outline:none;border-color:var(--accent)}
  .meta{font-size:11px;color:var(--muted);margin-top:6px}
  @media (max-width:820px){main{grid-template-columns:1fr}aside{display:none}}
</style>
</head>
<body>
<header>
  <h1>Agent Console</h1>
  <span class="pill" id="provider">connecting</span>
  <span class="pill" id="corpus">-</span>
  <span class="spacer"></span>
  <button id="reindex">Reindex data/</button>
  <button id="clear">Clear</button>
</header>

<main>
  <div id="chat"></div>
  <aside>
    <h2>Agent trace</h2>
    <div id="trace"><p style="color:var(--muted);font-size:12px">Tool calls appear here as the agent works.</p></div>
  </aside>
</main>

<form id="form">
  <input id="input" autocomplete="off" placeholder="Ask something about the indexed data..." />
  <button id="send" type="submit">Send</button>
</form>

<script>
const chat=document.getElementById('chat'),trace=document.getElementById('trace');
const form=document.getElementById('form'),input=document.getElementById('input'),send=document.getElementById('send');
let history=[];

function bubble(who,text,cls){
  const d=document.createElement('div');d.className='msg '+cls;
  d.innerHTML='<div class="who"></div><div class="bubble"></div>';
  d.querySelector('.who').textContent=who;d.querySelector('.bubble').textContent=text;
  chat.appendChild(d);chat.scrollTop=chat.scrollHeight;return d;
}
function renderTrace(steps){
  trace.innerHTML='';
  if(!steps.length){trace.innerHTML='<p style="color:var(--muted);font-size:12px">No tools were called.</p>';return;}
  steps.forEach(s=>{
    const d=document.createElement('div');d.className='step';
    d.innerHTML='<div class="name"></div><pre class="a"></pre><pre class="r"></pre>';
    d.querySelector('.name').textContent='step '+s.step+' · '+s.tool;
    d.querySelector('.a').textContent='args '+s.args;
    d.querySelector('.r').textContent=s.result_preview;
    trace.appendChild(d);
  });
}
async function health(){
  try{
    const h=await (await fetch('/api/health')).json();
    const p=document.getElementById('provider');
    p.textContent=h.provider==='mock'?'mock mode (no API key)':h.provider+' · '+h.model;
    p.className='pill '+(h.provider==='mock'?'mock':'live');
    document.getElementById('corpus').textContent=h.chunks+' chunks · '+h.files+' files';
  }catch(e){document.getElementById('provider').textContent='server unreachable';}
}
form.onsubmit=async e=>{
  e.preventDefault();
  const q=input.value.trim();if(!q)return;
  input.value='';send.disabled=true;
  bubble('you',q,'user');
  const pending=bubble('agent','thinking...','bot');
  try{
    const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({message:q,history})});
    const data=await r.json();
    if(data.error)throw new Error(data.error);
    pending.querySelector('.bubble').textContent=data.answer;
    if(data.sources&&data.sources.length){
      const s=document.createElement('div');s.className='srcs';
      data.sources.forEach(x=>{const t=document.createElement('span');t.textContent=x;s.appendChild(t);});
      pending.appendChild(s);
    }
    const m=document.createElement('div');m.className='meta';
    m.textContent=data.steps+' step(s) · '+data.elapsed_s+'s';
    pending.appendChild(m);
    renderTrace(data.trace||[]);
    history.push({role:'user',content:q},{role:'assistant',content:data.answer});
    history=history.slice(-8);
  }catch(err){pending.querySelector('.bubble').textContent='Error: '+err.message;}
  send.disabled=false;input.focus();chat.scrollTop=chat.scrollHeight;
};
document.getElementById('reindex').onclick=async()=>{
  const r=await (await fetch('/api/ingest',{method:'POST'})).json();
  bubble('system','Reindexed: '+r.chunks+' chunks from '+r.files_indexed+' files','bot');health();
};
document.getElementById('clear').onclick=()=>{chat.innerHTML='';history=[];renderTrace([]);};
health();input.focus();
</script>
</body>
</html>
